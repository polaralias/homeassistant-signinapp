name: Python tests
on: [push, pull_request]
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            ha: "2025.1.4"
          - python: "3.14"
            ha: "2026.10.4"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install --pre "homeassistant==${{ matrix.ha }}" "pyotp==2.8.0" "PyQRCode==1.2.1"
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
