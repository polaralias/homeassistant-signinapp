                - grid-template-columns: 24px minmax(0,1fr) auto
                - grid-template-rows: 28px auto
                - column-gap: 8px
                - row-gap: 10px
              icon:
                - width: 22px
                - color: var(--accent-color)
              name:
                - justify-self: start
                - font-size: 14px
              state:
                - justify-self: end
                - font-size: 16px
                - font-weight: '600'
                - color: var(--primary-text-color)
              custom_fields:
                days:
                  - width: 100%
                  - min-width: '0'
            triggers_update:
