views:
  - title: Attendance
    path: attendance
    icon: mdi:briefcase-clock
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Attendance
            heading_style: title
            icon: mdi:login
          - show_name: true
            show_icon: true
            type: button
            entity: sensor.attendee_status
            tap_action:
              action: perform-action
              perform_action: signinapp.sign_in
              target: {}
              data:
                device_id: REPLACE_WITH_DEVICE_ID
                site_id: 2002
            name: Sign in · secondary site
            grid_options:
              columns: 4
              rows: 2
          - show_name: true
            show_icon: true
            type: button
            entity: sensor.attendee_status
            tap_action:
              action: perform-action
              perform_action: signinapp.sign_in
              target: {}
              data:
                device_id: REPLACE_WITH_DEVICE_ID
                site_id: 1001
            name: Sign in · primary site
            grid_options:
              columns: 4
              rows: 2
          - show_name: true
            show_icon: true
            type: button
            entity: sensor.attendee_status
            tap_action:
              action: perform-action
              perform_action: signinapp.sign_out
              target: {}
              data:
                device_id: REPLACE_WITH_DEVICE_ID
            name: Sign Out
            grid_options:
              columns: 4
              rows: 2
          - type: tile
            entity: sensor.attendee_status
            name: Status
            vertical: false
            features_position: bottom
          - type: tile
            entity: sensor.customzone_campus
            name: Presence
            vertical: false
            features_position: bottom
          - type: heading
            heading: Logged Time
            heading_style: subtitle
            icon: mdi:briefcase-clock
          - type: custom:button-card
            entity: sensor.attendee_week_signed_in
            name: This week
            icon: mdi:calendar-week
            show_state: true
            state_display: "[[[ const raw=entity?.state;if(raw===undefined||raw===null||raw===''||!Number.isFinite(Number(raw)))return
              'Unavailable';const minutes=Math.floor(Number(raw)*4+0.5)*15;const hours=Math.floor(minutes/60),remainder=minutes%60;return
              hours?hours+'h'+(remainder?' '+remainder+'m':''):minutes+'m'; ]]]"
            tap_action:
              action: more-info
            custom_fields:
              days:
                card:
                  type: grid
                  columns: 7
                  square: false
                  cards:
                    - type: custom:button-card
                      entity: sensor.attendee_monday_signed_in
                      name: Mon
                      show_icon: false
                      show_state: true
                      state_display: "[[[ const days=[\"Monday\", \"Tuesday\", \"Wednesday\", \"Thursday\", \"Friday\", \"\
                        Saturday\", \"Sunday\"];const currentDay=new Date().toLocaleDateString('en-GB',{weekday:'long',timeZone:hass.config.time_zone});if(days.indexOf(currentDay)<0)return
                        \"0m\"; const raw=states[\"sensor.attendee_monday_signed_in\"]?.state;if(raw===undefined||raw===null||raw===''||!Number.isFinite(Number(raw)))return
                        'Unavailable';const minutes=Math.floor(Number(raw)*4+0.5)*15;const hours=Math.floor(minutes/60),remainder=minutes%60;return
                        hours?hours+'h'+(remainder?' '+remainder+'m':''):minutes+'m'; ]]]"
                      tap_action:
                        action: more-info
                      hold_action:
                        action: none
                      styles:
                        card:
                          - background: transparent
                          - border: none
                          - box-shadow: none
                          - padding: 4px 0
                          - height: 44px
                          - border-radius: 6px
                        grid:
                          - grid-template-areas: '"n" "s"'
                          - grid-template-columns: minmax(0,1fr)
                          - grid-template-rows: 17px 19px
                        name:
                          - font-size: 11px
                          - font-weight: '600'
                          - color: "[[[ return new Date().toLocaleDateString('en-GB',{weekday:'long',timeZone:hass.config.time_zone})===\"\
                              Monday\"?'var(--accent-color)':'var(--secondary-text-color)'; ]]]"
                        state:
                          - font-size: 10.5px
                          - font-weight: '600'
                          - white-space: nowrap
                          - color: var(--primary-text-color)
                          - font-variant-numeric: tabular-nums
