sign_in:
  name: Sign In
  description: Sign in to a configured location by concrete site ID or compatibility site type.
  fields:
    site_id:
      name: Site ID
      description: Preferred explicit configured site ID to sign in to.
      required: false
      selector:
        number:
          min: 1
          mode: box
    site_type:
      name: Site Type
      description: Compatibility hint for the type of site to sign in to when a concrete site ID is not provided.
      required: false
      selector:
        select:
          options:
            - label: Office
              value: office
            - label: Remote
              value: remote
    device_id:
      name: Device
      description: The device to perform the action on.
      required: false
      selector:
        device:
          integration: signinapp

sign_out:
  name: Sign Out
  description: Sign out from the current site, or from a configured location by concrete site ID or compatibility site type.
  fields:
    site_id:
      name: Site ID
      description: Preferred explicit configured site ID to sign out from.
      required: false
      selector:
        number:
          min: 1
          mode: box
    site_type:
      name: Site Type
      description: Compatibility hint for the type of site to sign out from when a concrete site ID is not provided.
      required: false
      selector:
        select:
          options:
            - label: Office
              value: office
            - label: Remote
              value: remote
    device_id:
      name: Device
      description: The device to perform the action on.
      required: false
      selector:
        device:
          integration: signinapp
